<!DOCTYPE html>

<!-- 
  This is a poopy dumb dumb ai client. It will get better I swear, this is bad. Only for testing. :(
-->

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum Client</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0f1115;
      color: #e8eaed;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 340px;
      background: #151922;
      border-right: 1px solid #222834;
      padding: 24px;
      overflow-y: auto;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f1115;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    input, textarea, button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    input, textarea {
      background: #1b2130;
      color: white;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      background: #4f8cff;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column-reverse;
      gap: 16px;
    }

    .post {
      background: #171c26;
      border: 1px solid #252c39;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .post-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .post-user {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    .post-body {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .status {
      font-size: 13px;
      opacity: 0.75;
      margin-top: 8px;
    }

    .topbar {
      padding: 20px 24px;
      border-bottom: 1px solid #222834;
      background: #12161f;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h1>Forum</h1>
    <h2>Create Post</h2>

    <input id="username" placeholder="Username">
    <input id="title" placeholder="Post title">
    <textarea id="body" placeholder="Write something interesting..."></textarea>

    <button onclick="createPost()">Publish Post</button>
    <button onclick="loadInitialPosts()">Refresh Feed</button>

    <div class="status" id="status">Connecting...</div>
  </div>

  <div class="main">
    <div class="topbar">Live Feed</div>
    <div class="feed" id="feed"></div>
  </div>

  <script>
    const socket = new WebSocket("ws://fries.aerioncloud.is-local.org");
    const feed = document.getElementById("feed");
    const status = document.getElementById("status");

    let currentCount = 10;
    let loading = false;

    socket.onopen = () => {
      status.textContent = "Connected to server";
      loadInitialPosts();
    };

    socket.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);

        if (Array.isArray(data)) {
          renderPosts(data);
        } else if (data.status === "saved") {
          status.textContent = "Post published successfully";
          clearForm();
          loadInitialPosts();
        } else {
          console.log(data);
        }
      } catch (err) {
        console.log(event.data);
      }

      loading = false;
    };

    socket.onerror = () => {
      status.textContent = "Connection error";
    };

    function createPost() {
      const payload = {
        type: "post",
        username: document.getElementById("username").value || "Anonymous",
        title: document.getElementById("title").value || "Untitled Post",
        body: document.getElementById("body").value || ""
      };

      socket.send(JSON.stringify(payload));
    }

    function loadInitialPosts() {
      currentCount = 10;
      requestPosts();
    }

    function requestPosts() {
      if (loading) return;
      loading = true;

      socket.send(JSON.stringify({
        type: "getcount",
        count: currentCount
      }));
    }

    function renderPosts(posts) {
      feed.innerHTML = "";

      [...posts].reverse().forEach(post => {
        const div = document.createElement("div");
        div.className = "post";
        div.innerHTML = `
          <div class="post-title">${escapeHtml(post.title || "Untitled")}</div>
          <div class="post-user">posted by ${escapeHtml(post.username || "Anonymous")}</div>
          <div class="post-body">${escapeHtml(post.body || "")}</div>
        `;
        feed.appendChild(div);
      });
    }

    function clearForm() {
      document.getElementById("title").value = "";
      document.getElementById("body").value = "";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    feed.addEventListener("scroll", () => {
      if (feed.scrollTop === 0 && !loading) {
        currentCount += 10;
        status.textContent = `Loading older posts (${currentCount})...`;
        requestPosts();
      }
    });
  </script>
</body>
</html>
